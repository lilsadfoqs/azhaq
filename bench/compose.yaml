# Local targets for `go run ./bench`. The images are pinned in bench/images.env
# (tag and digest, the list .github/ci/labs.sh uses too), so numbers stay
# comparable:
#   docker compose --env-file bench/images.env -f bench/compose.yaml up -d
name: azhaq-bench

services:
  juice-shop:
    image: ${AZQ_JUICE_IMAGE:?pass --env-file bench/images.env}
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      # It keeps memory for every path it is asked: a 4,750-word sweep
      # outgrows node's default heap and kills it.
      NODE_OPTIONS: "--max-old-space-size=4096"

  vampi:
    image: ${AZQ_VAMPI_IMAGE:?pass --env-file bench/images.env}
    ports:
      - "127.0.0.1:5102:5000"
