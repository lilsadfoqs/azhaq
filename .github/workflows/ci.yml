name: ci

on:
  # Work reaches next and main through pull requests, squash-merged: the
  # race tests run on the pull request, and again on the merged branch.
  push:
    branches: [next, main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: Run every test again, ignoring kept results
        type: boolean
        default: true

# A newer push to a branch replaces its running one; main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
      - name: golangci-lint binary
        # Built with the Go of the job: a release built with an older one refuses the module.
        # The key names that Go, so a new Go builds it again.
        id: bin
        uses: actions/cache@v6
        with:
          path: ~/golangci-bin
          key: golangci-lint-v2.15.0-go${{ steps.go.outputs.go-version }}
      - name: build golangci-lint
        if: steps.bin.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/golangci-bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: golangci-lint cache
        # Its analysis cache: one entry per commit, the newest one restored by prefix.
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: golangci-lint-cache-${{ runner.os }}-
      - name: golangci-lint
        # forbidigo: only internal/egress opens an outbound connection (.golangci.yml).
        run: ~/golangci-bin/golangci-lint run ./...

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: commit messages
        # Every commit of the push, against .commitlintrc.yml (CONTRIBUTING.md).
        if: github.event_name == 'push' && !startsWith(github.event.before, '0000000')
        run: |
          git fetch -q --depth=50 origin "${{ github.event.before }}" || git fetch -q --unshallow origin
          npm i -g --silent @commitlint/cli@19.8.1
          commitlint --from "${{ github.event.before }}" --to HEAD
      - name: ci scripts
        # The workflow trials' estate builder, grader and isolation script; the
        # test split; the bench's planner and artifact helpers.
        run: |
          python3 -m unittest discover -s .github/ci/range
          python3 -m unittest discover -s .github/ci/parity
          python3 -m unittest discover -s .github/ci -p 'test_*.py'
          bash -n .github/ci/range/isolate.sh .github/ci/run.sh .github/ci/fetch.sh .github/ci/apt-tools.sh .github/ci/latest-artifact.sh .github/ci/bench-tools.sh .github/ci/beat.sh .github/ci/watch.sh .github/ci/heartbeat.sh .github/ci/history.sh .github/ci/parity/replay.sh .github/ci/parity/seed.sh .github/ci/parity/fetch.sh
      - name: documented claims
        # What the README and the covered command pages claim has a test or a bench
        # check that proves it (docs/claims.tsv); lists the pages not covered yet.
        run: go run ./scripts/claims
      - name: test shards
        # Every test runs in exactly one shard (keep --shards equal to the matrix below).
        run: python3 .github/ci/shard.py --check --shards 6
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: licenses
        # GPL, AGPL, SSPL and unknown licenses fail the build.
        run: go run github.com/google/go-licenses/v2@v2.0.1 check ./... --disallowed_types=forbidden,restricted,unknown

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Six shards, packed by .github/ci/test-times.json (shard.py has the rules).
        shard: [0, 1, 2, 3, 4, 5]
    env:
      CACHE_KEY: go-test-linux-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: file times
        # go test keeps a passing result while the files it opened keep size and time;
        # a clone stamps them all with now.
        run: python3 .github/ci/mtime.py
      - name: restore build and test cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ env.CACHE_KEY }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            go-test-linux-
      - name: test
        # Nightly and manual runs pass --fresh (-count=1): a kept result never hides a flaky test.
        run: python3 .github/ci/shard.py --shards 6 --index ${{ matrix.shard }} ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fresh)) && '--fresh' || '' }}
      - name: cache size
        if: always()
        run: du -sh ~/.cache/go-build ~/go/pkg/mod
      - name: save build and test cache
        # Also when tests fail: the passing ones are kept for the next run.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ env.CACHE_KEY }}-${{ github.sha }}
      - name: times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: times-${{ matrix.shard }}
          path: times-${{ matrix.shard }}.json
          if-no-files-found: ignore

  reference:
    # The reference matrix: fixtures shaped like real cases, azhaq's default
    # output against curl, nmap -sV and katana (internal/contract, tag
    # reference). katana is the release pinned in bench/tools.go.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: reference tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nmap
          mkdir -p "$HOME/refbin"
          curl -sSfL -o katana.zip https://github.com/projectdiscovery/katana/releases/download/v1.8.0/katana_1.8.0_linux_amd64.zip
          echo "cb027ae99d0757061b70c07a15c7a80f62c5a535ab52c4a329f80c4b0a7309d2  katana.zip" | sha256sum -c -
          unzip -q katana.zip katana -d "$HOME/refbin"
      - name: reference matrix
        run: PATH="$HOME/refbin:$PATH" go test -tags reference -count=1 -timeout 20m ./internal/contract -run TestReference

  ephemeral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: ephemeral range
        # It connects to every ephemeral port, so it runs with nothing else.
        run: AZHAQ_EPHEMERAL_SCAN=1 go test -race -count=1 ./internal/portscan -run TestEphemeralRangeHasNoPhantomPorts

  install-check:
    # The install script, checked against a build, not a real release: a
    # goreleaser snapshot (no sign, sbom or docker image; nothing published),
    # then scripts/install.sh -f against that local dist/. A trial, bench or
    # hunt tag (pushed to start a CI run) must not be mistaken for a release
    # when goreleaser picks the "current" tag for the snapshot version, so
    # this pins GORELEASER_CURRENT_TAG to the latest real vX.Y.Z tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - id: tag
        run: echo "tag=$(git tag -l 'v*' --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"
      - name: this runner's target only
        # The script is what is checked: one archive is enough.
        run: |
          sed 's/^    goos: .*/    goos: [linux]/; s/^    goarch: .*/    goarch: [amd64]/' .goreleaser.yaml > "$RUNNER_TEMP/goreleaser.yaml"
          grep -n 'goos\|goarch' "$RUNNER_TEMP/goreleaser.yaml"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --config ${{ runner.temp }}/goreleaser.yaml --skip=sign,sbom,docker
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
      - name: install from the snapshot
        run: |
          version=$(python3 -I -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          echo "snapshot version: $version"
          sh scripts/install.sh -v "$version" -f dist -d "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/azhaq" version | grep -qF "$version" || { echo "::error::azhaq version did not report $version"; exit 1; }
