name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  packages: write # the image on ghcr.io
  id-token: write
  actions: read # the checklist run of this commit

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The tests ran in ci on main for this commit (104 s here before);
      # a tag off main would skip them, so it is refused.
      - name: tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # The review's checklist, as commands, on this very commit (checklist.yml:
      # a push to next, or .github/ci/run.sh checklist NAME). A warning for now:
      # whether a release waits for it is the maintainer's decision.
      - name: the checklist passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checklist.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          [ "$n" -gt 0 ] || echo "::warning::no passing checklist run for $GITHUB_SHA (.github/ci/run.sh checklist NAME runs one)"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.54.0
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
