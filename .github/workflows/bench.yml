name: bench

# The whole benchmark, both profiles by default, in parallel jobs. The plan
# job asks the bench for its units (one section in one profile, one claims
# case, or a section that runs once) and packs them into at most MAXPARTS
# jobs by their measured times (.github/ci/bench-times.json, refreshed with
# .github/ci/bench_times.py from a run's log); each job runs its units on its
# own runner and a last job joins the records (go run ./bench -merge). Push an
# annotated tag bench-NAME whose message holds the bench's flags (for example
# "-profile polite"); -only and -profile restrict the units. The joined
# record and the logs go to the ci-results branch under bench/NAME/.
#
# Two artifacts of earlier runs speed the jobs up (latest-artifact.sh; Actions
# caches would not do: a tag run reads only its own ref's caches, and every
# bench run is a new tag): the reference tools (bench-tools-HASH-GOVERSION,
# the hash of bench/tools.go) and the reference tools' results of the UTC day
# (bench-ref-DAY). The merge job uploads the new ones. -fresh in the tag
# message neither fetches nor uploads the results.
#
# A tag gate-NAME (.github/ci/run.sh gate) starts this and hunt.yml on one
# commit: the bench takes its default flags, whatever the message says (the
# words are the hunt's), and writes bench/gate-NAME/.
on:
  push:
    tags: ["bench-*", "gate-*"]

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      args: ${{ steps.p.outputs.args }}
      parts: ${{ steps.p.outputs.parts }}
      units: ${{ steps.p.outputs.units }}
      day: ${{ steps.p.outputs.day }}
      fresh: ${{ steps.p.outputs.fresh }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - id: p
        env:
          MAXPARTS: ${{ vars.BENCH_MAXPARTS || '14' }}
        run: |
          args=""
          if [[ "$GITHUB_REF_NAME" != gate-* ]] && [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ]; then
            args=$(git for-each-ref --format='%(contents:subject)' "refs/tags/$GITHUB_REF_NAME")
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fresh=false
          [[ " $args " == *" -fresh "* ]] && fresh=true
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          # The units this tag's flags select, packed by measured time.
          # shellcheck disable=SC2086 # the flags are words
          go run ./bench $args -list-units > units.txt
          echo "units=$(paste -sd, units.txt)" >> "$GITHUB_OUTPUT"
          parts=$(.github/ci/bench_plan.py --times .github/ci/bench-times.json --max-parts "$MAXPARTS" < units.txt)
          echo "parts=$parts" >> "$GITHUB_OUTPUT"

  part:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
      - name: fetch the reference tools and results of earlier runs
        # A miss is no failure: the bench installs what is missing.
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ needs.plan.outputs.day }}
          FRESH: ${{ needs.plan.outputs.fresh }}
        run: |
          .github/ci/latest-artifact.sh "$(.github/ci/bench-tools.sh key)" bench/.work
          [ "$FRESH" = true ] || .github/ci/latest-artifact.sh "bench-ref-$DAY" bench/.work/refcache
          .github/ci/bench-tools.sh list > tools-before.txt
      - name: reference tools from apt
        run: sudo apt-get update -q && sudo apt-get install -y -q nmap dnsutils
      - name: bench
        env:
          ARGS: ${{ needs.plan.outputs.args }}
          UNITS: ${{ matrix.units }}
        run: |
          echo "bench flags: $ARGS -units $UNITS"
          # shellcheck disable=SC2086 # the flags are words
          go run ./bench $ARGS -units "$UNITS" -nmap "$(command -v nmap)" 2>&1 | tee "bench-${{ matrix.name }}.log" || true
          mkdir -p part
          mv "bench-${{ matrix.name }}.log" part/
          f=$(ls -t bench/history/*.json 2>/dev/null | head -1 || true)
          # Only a record this job wrote: the checkout holds older ones.
          if [ -n "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
            cp "$f" "part/${{ matrix.name }}.json"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.name }}
          path: part/
          retention-days: 7
      - name: pack the reference tools this job added
        id: tools
        if: always()
        run: |
          .github/ci/bench-tools.sh list > tools-after.txt
          if ! cmp -s tools-before.txt tools-after.txt; then
            .github/ci/bench-tools.sh pack tools-out
            echo "added=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.tools.outputs.added == 'true'
        with:
          name: tools-${{ matrix.name }}
          path: tools-out/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always() && needs.plan.outputs.fresh != 'true'
        with:
          name: refcache-${{ matrix.name }}
          path: bench/.work/refcache
          if-no-files-found: ignore
          retention-days: 7

  merge:
    needs: [plan, part]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/download-artifact@v7
        with:
          pattern: bench-*
          path: parts
          merge-multiple: true
      - name: fetch the reference results and tools of earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ needs.plan.outputs.day }}
          FRESH: ${{ needs.plan.outputs.fresh }}
        run: |
          .github/ci/latest-artifact.sh "$(.github/ci/bench-tools.sh key)" bench/.work
          [ "$FRESH" = true ] || .github/ci/latest-artifact.sh "bench-ref-$DAY" bench/.work/refcache
      - name: download the jobs' reference results
        if: needs.plan.outputs.fresh != 'true'
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: refcache-*
          path: added
      - name: download the jobs' reference tools
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: tools-*
          path: added
      - name: pack the reference results and tools
        id: pack
        env:
          FRESH: ${{ needs.plan.outputs.fresh }}
        run: |
          # The jobs' result folders hold what they fetched too: joined over the
          # one fetched here, the newest copy of an entry wins (its name is a hash).
          if [ "$FRESH" != true ]; then
            mkdir -p bench/.work/refcache
            for d in added/refcache-*; do
              [ -d "$d" ] && cp -a "$d"/. bench/.work/refcache/
            done
            if [ -n "$(ls -A bench/.work/refcache)" ]; then
              mkdir -p ref-out
              tar -cf ref-out/artifact.tar -C bench/.work/refcache .
              echo "ref=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          tools=false
          for t in added/tools-*/artifact.tar; do
            [ -f "$t" ] && { tar -xf "$t" -C bench/.work; tools=true; }
          done
          if [ "$tools" = true ]; then
            .github/ci/bench-tools.sh pack tools-out
            echo "tools=true" >> "$GITHUB_OUTPUT"
            echo "toolskey=$(.github/ci/bench-tools.sh key)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.pack.outputs.ref == 'true'
        with:
          name: bench-ref-${{ needs.plan.outputs.day }}
          path: ref-out/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: steps.pack.outputs.tools == 'true'
        with:
          name: ${{ steps.pack.outputs.toolskey }}
          path: tools-out/
          retention-days: 7
      - name: join
        env:
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          ls parts
          go run ./bench -merge -expect "$UNITS" -out bench/joined parts/*.json 2>&1 | tee merge.log || true
          { for l in parts/*.log; do echo "=== $l"; cat "$l"; done; echo "=== join"; cat merge.log; } > bench.log
      - name: publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(bench.log)
          f=$(ls -t bench/joined/*.json 2>/dev/null | head -1 || true)
          [ -n "$f" ] && files+=("$f")
          .github/ci/publish.sh "bench/$GITHUB_REF_NAME" "${files[@]}"
      - name: failed checks
        # Annotations read without a login; the record is on ci-results.
        env:
          PARTS: ${{ needs.plan.outputs.parts }}
        run: |
          missing=0
          for n in $(jq -r '.[].name' <<<"$PARTS"); do
            [ -f "parts/$n.json" ] || { echo "::error title=bench::the $n job wrote no record (see its log)"; missing=1; }
          done
          f=$(ls -t bench/joined/*.json | head -1)
          jq -r '"::notice title=bench::\([.checks[] | select(.pass)] | length) of \(.checks | length) checks pass"' "$f"
          jq -r '.checks[] | select(.pass | not) | "::warning title=FAIL::\(.name): \(.detail | .[0:300])"' "$f" | head -40
          exit $missing
